<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古籍经典多版本对照平台</title>
    <meta name="description" content="道德经、庄子、周易等经典多版本对照研究平台">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2c1810 0%, #4a3728 100%);
            min-height: 100vh;
            font-family: 'KaiTi', '楷体', serif;
        }
        .home-page {
            padding: 4rem 2rem;
        }
        .home-header {
            text-align: center;
            margin-bottom: 3rem;
            color: #d4a574;
        }
        .home-header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .home-header p {
            color: rgba(212, 165, 116, 0.8);
            font-size: 1.1rem;
        }
        .classic-card {
            display: block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 165, 116, 0.3);
            border-radius: 12px;
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            height: 100%;
            backdrop-filter: blur(10px);
        }
        .classic-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            border-color: #d4a574;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .classic-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .classic-info {
            padding-left: 0.5rem;
        }
        .classic-name {
            margin: 0 0 0.5rem 0;
            color: #d4a574;
        }
        .classic-author {
            color: rgba(212, 165, 116, 0.7);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .classic-desc {
            color: rgba(232, 224, 216, 0.8);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        .classic-chapters {
            display: inline-block;
            background: rgba(212, 165, 116, 0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #d4a574;
        }
        .footer {
            text-align: center;
            padding: 2rem;
            color: rgba(212, 165, 116, 0.6);
            margin-top: 4rem;
        }
    </style>
</head>
<body>
    <div class="home-page">
        <div class="home-header">
            <h1>📚 古籍经典多版本对照平台</h1>
            <p>探索中华典籍智慧 · 多版本对照研究 · 深度阅读体验</p>
        </div>

        <div class="container">
            <div class="row">

            </div>
        </div>

        <footer class="footer">
            <small>古籍经典多版本对照平台 | 道德经 · 庄子 · 周易 · 六祖坛经 · 金刚经 · 唯识三十颂 · 传习录 · 四书 · 黄帝内经</small>
        </footer>
    </div>
</body>
</html>
