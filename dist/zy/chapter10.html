            <h1>履</h1>
            <div class="original-text">履：履虎尾，不咥人，亨。</div>
            <div class="notes"><div class="note"><h3>Wangbi</h3><p>履者，礼也。上天下泽，履。</p></div><div class="note"><h3>Chengyi</h3><p>履卦象征履行，以柔克刚。</p></div><div class="note"><h3>Zhuxi</h3><p>履，柔履刚也。</p></div></div>
