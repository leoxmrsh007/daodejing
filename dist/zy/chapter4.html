            <h1>蒙</h1>
            <div class="original-text">蒙：亨，匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。</div>
            <div class="notes"><div class="note"><h3>Wangbi</h3><p>蒙者，昧也。山下有险，险而止，蒙。</p></div><div class="note"><h3>Chengyi</h3><p>蒙卦象征启蒙教育。</p></div><div class="note"><h3>Zhuxi</h3><p>蒙以养正，圣功也。</p></div></div>
