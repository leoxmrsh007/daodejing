            <h1>讼</h1>
            <div class="original-text">讼：有孚窒惕，中吉，终凶。利见大人，不利涉大川。</div>
            <div class="notes"><div class="note"><h3>Wangbi</h3><p>讼者，争也。上刚下险，险而健，讼。</p></div><div class="note"><h3>Chengyi</h3><p>讼卦象征争讼，宜解不宜结。</p></div><div class="note"><h3>Zhuxi</h3><p>讼，上刚下险，险而健讼。</p></div></div>
