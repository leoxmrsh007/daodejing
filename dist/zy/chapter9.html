            <h1>小畜</h1>
            <div class="original-text">小畜：亨，密云不雨，自我西郊。</div>
            <div class="notes"><div class="note"><h3>Wangbi</h3><p>小畜者，以小畜大。风行天上，小畜。</p></div><div class="note"><h3>Chengyi</h3><p>小畜象征小有蓄积。</p></div><div class="note"><h3>Zhuxi</h3><p>小畜，柔得位而上下应之。</p></div></div>
