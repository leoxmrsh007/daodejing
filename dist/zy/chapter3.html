            <div class="original-text">屯：元亨利贞，勿用有攸往，利建侯。</div>
            <div class="notes"><div class="note"><h3>Wangbi</h3><p>屯者，难也。物之始生，刚柔始交而难生。</p></div><div class="note"><h3>Chengyi</h3><p>屯卦象征事物初生之艰难。</p></div><div class="note"><h3>Zhuxi</h3><p>屯为难，君子以经纶。</p></div></div>
