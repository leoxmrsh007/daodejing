            <h1>坤</h1>
            <div class="original-text">坤：元亨，利牝马之贞。君子有攸往，先迷后得主，利。西南得朋，东北丧朋。安贞吉。</div>
            <div class="notes"><div class="note"><h3>Wangbi</h3><p>坤者，顺也。地势坤，君子以厚德载物。</p></div><div class="note"><h3>Chengyi</h3><p>坤卦象地，地道柔顺利贞。</p></div><div class="note"><h3>Zhuxi</h3><p>坤为地，地道柔顺利贞，厚德载物。</p></div></div>
