            <div class="original-text">时，大师至宝林，韶州韦刺史与官僚入山请师出，于城中大梵寺讲堂，为众开缘说法。师升座次，刺史官僚三十余人，儒宗学士三十余人，同请大师说摩诃般若波罗蜜法。</div>
