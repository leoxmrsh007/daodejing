            <h1>般若品第二</h1>
            <div class="original-text">次日，韦刺史问曰：弟子闻和尚说法，实不可思议。今有少疑，愿大慈悲，特为解说。师曰：有疑即问，吾当为说。韦公曰：和尚所说，可不是达摩大师宗旨乎？</div>
