            <h1>无为福胜分第十一</h1>
            <div class="original-text">须菩提！如恒河中所有沙数，如是沙等恒河，于意云何？是诸恒河沙宁为多不？须菩提言：甚多，世尊！但诸恒河尚多无数，何况其沙。须菩提！我今实言告汝：若有善男子、善女人，以七宝满尔所恒河沙数三千大千世界以用布施，得福多不？须菩提言：甚多，世尊！佛告须菩提：若善男子、善女人，于此经中，乃至受持四句偈等，为他人说，而此福德胜前福德。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明持经福胜。</p></div></div>
