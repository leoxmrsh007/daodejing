            <h1>无法可得分第二十二</h1>
            <div class="original-text">须菩提白佛言：世尊！佛得阿耨多罗三藐三菩提，云何可得？佛告须菩提：佛于阿耨多罗三藐三菩提，无所得，汝勿作是念。若作是念，阿耨多罗三藐三菩提法不可得。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明菩提无所得。</p></div></div>
