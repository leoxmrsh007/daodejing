            <h1>依法出生分第八</h1>
            <div class="original-text">须菩提！于意云何？若人满三千大千世界七宝以用布施，是人所得福德，宁为多不？须菩提言：甚多，世尊！何以故？是福德即非福德性，是故如来说福德多。若复有人，于此经中受持，乃至四句偈等，为他人说，其福胜彼。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明持经功德胜于布施。</p></div></div>
