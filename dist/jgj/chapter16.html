            <h1>能净业障分第十六</h1>
            <div class="original-text">复次，须菩提！若有善男子、善女人，受持读诵此经，若为人轻贱，是人先世罪业，应堕恶道，以今世人轻贱故，先世罪业则为消灭，当得阿耨多罗三藐三菩提。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明持经能消罪业。</p></div></div>
