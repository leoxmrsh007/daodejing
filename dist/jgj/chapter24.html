            <h1>福智无比分第二十四</h1>
            <div class="original-text">须菩提！若三千大千世界中所有诸须弥山王，如是等七宝聚，有人持用布施；若人以此般若波罗蜜经，乃至四句偈等，受持读诵，为他人说，于前福德百分不及一，百千万亿分，乃至算数比喻所不能及。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明持经福智无比。</p></div></div>
