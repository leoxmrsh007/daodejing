            <h1>妙行无住分第四</h1>
            <div class="original-text">复次，须菩提！菩萨于法，应无所住，行于布施，所谓不住色布施，不住声香味触法布施。须菩提！菩萨应如是布施，不住于相。何以故？若菩萨不住相布施，其福德不可思量。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明布施无相之义。</p></div></div>
