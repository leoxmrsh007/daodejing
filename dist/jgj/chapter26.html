            <h1>法身非相分第二十六</h1>
            <div class="original-text">须菩提！于意云何？可以三十二相观如来不？须菩提言：如是！世尊！可以三十二相观如来。佛言：须菩提！若以三十二相观如来者，转轮圣王则是如来。须菩提白佛言：世尊！如我解佛所说义，不应以三十二相观如来。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明法身非相。</p></div></div>
