            <h1>无断无灭分第二十七</h1>
            <div class="original-text">须菩提！若菩萨以满恒河沙等世界七宝持用布施；若复有人知一切法无我，得成于忍，此菩萨胜前菩萨所得功德。须菩提！以诸菩萨不受福德故。须菩提白佛言：世尊！云何菩萨不受福德？须菩提！菩萨所作福德，不应贪着，是故说不受福德。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明无断灭相。</p></div></div>
