            <h1>净心行善分第二十三</h1>
            <div class="original-text">复次，须菩提！是法平等，无有高下，是名阿耨多罗三藐三菩提。以无我、无人、无众生、无寿者，修一切善法，则得阿耨多罗三藐三菩提。须菩提！所言善法者，如来说即非善法，是名善法。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明平等菩提。</p></div></div>
