            <h1>不受不贪分第二十八</h1>
            <div class="original-text">须菩提！若有人言：如来若来若去、若坐若卧。是人不解我所说义。何以故？如来者，无所从来，亦无所去，故名如来。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明如来无来去相。</p></div></div>
