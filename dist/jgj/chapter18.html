            <h1>一体同观分第十八</h1>
            <div class="original-text">须菩提！于意云何？如来有肉眼不？如是，世尊！如来有肉眼。须菩提！于意云何？如来有天眼不？如是，世尊！如来有天眼。须菩提！于意云何？如来有慧眼不？如是，世尊！如来有慧眼。须菩提！于意云何？如来有法眼不？如是，世尊！如来有法眼。须菩提！于意云何？如来有佛眼不？如是，世尊！如来有佛眼。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明如来看法平等。</p></div></div>
