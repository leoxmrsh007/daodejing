            <h1>离相寂灭分第十四</h1>
            <div class="original-text">尔时，须菩提闻说是经，深解义趣，涕泪悲泣，而白佛言：希有，世尊！佛说如是甚深经典，我从昔来所得慧眼，未曾得闻如是之经。若复有人得闻是经，信心清净，则生实相，当知是人成就第一希有功德。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明闻经深信之功德。</p></div></div>
