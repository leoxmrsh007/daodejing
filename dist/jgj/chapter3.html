            <h1>大乘正宗分第三</h1>
            <div class="original-text">佛告须菩提：诸菩萨摩诃萨应如是降伏其心！所有一切众生之类：若卵生、若胎生、若湿生、若化生；若有色、若无色；若有想、若无想、若非有想非无想，我皆令入无余涅槃而灭度之。如是灭度无量无数无边众生，实无众生得灭度者。何以故？须菩提！若菩萨有我相、人相、众生相、寿者相，即非菩萨。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明菩萨度生无相之义。</p></div></div>
