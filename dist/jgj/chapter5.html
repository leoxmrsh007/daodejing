            <h1>如理实见分第五</h1>
            <div class="original-text">须菩提！于意云何？可以身相见如来不？不也，世尊！不可以身相得见如来。何以故？如来说身相，即非身相。佛告须菩提：凡所有相，皆是虚妄。若见诸相非相，即见如来。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明法身无相。</p></div></div>
