            <h1>应化非真分第三十二</h1>
            <div class="original-text">须菩提！发阿耨多罗三藐三菩提心者，于一切法，应如是知，如是见，如是信解，不生法相。须菩提！所言法相者，如来说即非法相，是名法相。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明应化非真，经义究竟。</p></div></div>
