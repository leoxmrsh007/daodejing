            <h1>化无所化分第二十五</h1>
            <div class="original-text">须菩提！于意云何？汝等勿谓如来作是念：我当度众生。须菩提！莫作是念。何以故？实无众生如来度者。若有众生如来度者，如来则有我人众生寿者。须菩提！如来说有我者，则非有我，而凡夫之人以为有我。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明无众生可度。</p></div></div>
