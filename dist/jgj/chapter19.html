            <h1>法界通化分第十九</h1>
            <div class="original-text">须菩提！于意云何？若有人满三千大千世界七宝以用布施，是人以是因缘，得福多不？须菩提言：甚多，世尊！佛告须菩提：若福德实有，如来则不说是福德多。以福德无故，如来说得福德多。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明福德无实。</p></div></div>
