            <h1>正信希有分第六</h1>
            <div class="original-text">须菩提白佛言：世尊！颇有众生，得闻如是言说章句，生实信不？佛告须菩提：莫作是说。如来灭后，后五百岁，有持戒修福者，于此章句能生信心，以此为实，当知是人不于一佛二佛三四五佛而种善根已于无量千万佛所种诸善根。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明信心坚固则福胜。</p></div></div>
