            <h1>持经功德分第十五</h1>
            <div class="original-text">须菩提！若善男子、善女人，以恒河沙等身命布施；若复有人，于此经中，乃至受持四句偈等，为他人说，其福甚多！尔时，须菩提闻说是经，深解义趣，涕泪悲泣。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>重明持经功德。</p></div></div>
