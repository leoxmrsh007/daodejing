            <h1>法会因由分第一</h1>
            <div class="original-text">如是我闻。一时，佛在舍卫国祇树给孤独园，与大比丘众千二百五十人俱。尔时，世尊食时，着衣持钵，入舍卫大城乞食。于其城中，次第乞已，还至本处。饭食讫，收衣钵，洗足已，敷座而坐。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>此为序分，叙述说法因缘。</p></div></div>
