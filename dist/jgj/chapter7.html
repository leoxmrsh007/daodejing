            <h1>无得无说分第七</h1>
            <div class="original-text">须菩提！于意云何？如来得阿耨多罗三藐三菩提耶？如来有所说法耶？须菩提言：如我解佛所说义，无有定法名阿耨多罗三藐三菩提，亦无有定法如来可说。何以故？如来所说 法，皆不可取、不可说，非法、非非法。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明般若无法可得。</p></div></div>
