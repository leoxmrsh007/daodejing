            <h1>离色离相分第二十</h1>
            <div class="original-text">须菩提！于意云何？佛可以具足色身见不？不也，世尊！如来不应以具足色身见。何以故？如来说具足色身，即非具足色身，是名具足色身。如来说诸相具足，即非具足，是名具足。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明法身无相。</p></div></div>
