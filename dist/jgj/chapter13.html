            <h1>如法受持分第十三</h1>
            <div class="original-text">尔时，须菩提白佛言：世尊！当何名此经？我等云何奉持？佛告须菩提：是经名为《金刚般若波罗蜜》，以是名字，汝当奉持。所以者何？须菩提！佛说般若波罗蜜，即非般若波罗蜜，是名般若波罗蜜。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明经名及受持之法。</p></div></div>
