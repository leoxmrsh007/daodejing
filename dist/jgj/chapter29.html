        <article class="chapter">
            <h1>威仪寂净分第二十九</h1>
            <div class="original-text">须菩提！若善男子、善女人，以三千大千世界碎为微尘，于意云何？是微尘众宁为多不？须菩提言：甚多，世尊！何以故？若是微尘众实有者，佛则不说是微尘众。所以者何？佛说微尘众，即非微尘众，是名微尘众。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明微尘非实。</p></div></div>
