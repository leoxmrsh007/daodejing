            <h1>究竟无我分第十七</h1>
            <div class="original-text">佛告须菩提：如来灭后，后五百岁，有持戒修福者，于此章句能生信心，以此为实，当知是人不于一佛二佛三四五佛而种善根已于无量千万佛所种诸善根。闻是章句，乃至一念生净信者，须菩提！如来悉知悉见。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明无我之法。</p></div></div>
