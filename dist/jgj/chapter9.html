            <h1>一相无相分第九</h1>
            <div class="original-text">须菩提！于意云何？须陀洹能作是念我得须陀洹果不？须菩提言：不也，世尊！何以故？须陀洹名为入流，而无所入，不入色声香味触法，是名须陀洹。乃至阿罗汉亦复如是。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明四果无相。</p></div></div>
