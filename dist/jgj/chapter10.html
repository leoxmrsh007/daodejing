            <h1>庄严净土分第十</h1>
            <div class="original-text">佛告须菩提：于意云何？如来昔在燃灯佛所，于法有所得不？不也，世尊！如来于法实无所得。须菩提！菩萨庄严佛土不？不也，世尊！何以故？庄严佛土者，即非庄严，是名庄严。是故须菩提！诸菩萨摩诃萨应如是生清净心，不应住色生心，不应住声香味触法生心，应无所住而生其心。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明净土无相。</p></div></div>
