            <h1>尊重正教分第十二</h1>
            <div class="original-text">复次，须菩提！随说是经，乃至四句偈等，当知此处，一切世间、天、人、阿修罗，皆应供养，如佛塔庙，何况有人尽能受持读诵。须菩提！当知是人成就最上第一希有之法，若是经典所在之处，即为有佛，若尊重弟子。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明说法处即应供养。</p></div></div>
