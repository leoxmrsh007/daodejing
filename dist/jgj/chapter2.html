            <h1>善现启请分第二</h1>
            <div class="original-text">时，长老须菩提在大众中即从座起，偏袒右肩，右膝着地，合掌恭敬而白佛言：希有！世尊！如来善护念诸菩萨，善付嘱诸菩萨、世尊！善男子、善女人发阿耨多罗三藐三菩提心，应云何住？云何降伏其心？</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>须菩提请问发心住心之法。</p></div></div>
