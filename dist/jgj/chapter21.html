            <h1>非说所说分第二十一</h1>
            <div class="original-text">须菩提！汝勿谓如来作是念：我当有所说法。莫作是念！何以故？若人言如来有所说法，即为谤佛，不能解我所说故。须菩提！说法者，无法可说，是名说法。</div>
            <div class="notes"><div class="note"><h3>Kumrajiva</h3><p>明无说之法。</p></div></div>
