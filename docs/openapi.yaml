        semantic_changes:
          type: array
          description: 语义变化列表
          items:
            $ref: '#/components/schemas/SemanticChange'
      required:
        - chapter_id
        - concept
        - interpretations

    CommentatorInterpretation:
      type: object
      properties:
        commentator:
          type: string
          description: 注释家
          example: 王弼
        era:
          type: string
          description: 时代
          example: 魏晋
        text:
          type: string
          description: 解读文本
          example: "道者，无之称也"
        perspective:
          type: string
          description: 解读视角
          example: 以无为本
      required:
        - commentator
        - text

    SemanticChange:
      type: object
      properties:
        from_era:
          type: string
          description: 起始时代
          example: 先秦
        to_era:
          type: string
          description: 结束时代
          example: 汉代
        change_description:
          type: string
          description: 变化描述
          example: "从宇宙生成论转向政治哲学"
      required:
        - from_era
        - change_description

    # 跨文明对话相关 Schema
    PhilosopherInfo:
      type: object
      properties:
        id:
          type: string
          description: 哲学家 ID
          example: plato
        name:
          type: string
          description: 哲学家姓名
          example: 柏拉图
        name_original:
          type: string
          description: 原名
          example: Plato
        era:
          type: string
          description: 时代
          example: 古希腊
        tradition:
          type: string
          description: 哲学传统
          example: 西方哲学/古希腊哲学
        key_concepts:
          type: array
          description: 核心概念列表
          items:
            type: string
          example: [理念论，灵魂三分，哲人王]
        avatar:
          type: string
          description: 头像 URL
          example: /images/philosophers/plato.png
      required:
        - id
        - name
        - tradition

    PhilosophersResponse:
      type: object
      properties:
        philosophers:
          type: array
          description: 哲学家列表
          items:
            $ref: '#/components/schemas/PhilosopherInfo'
      required:
        - philosophers

    DialogueRequest:
      type: object
      properties:
        topic:
          type: string
          description: 对话主题
          example: 什么是理想的社会
        philosophers:
          type: array
          description: 参与对话的哲学家 ID 列表
          items:
            type: string
          example: [laozi, plato]
        context:
          type: string
          description: 对话背景或上下文
          example: 基于道德经第 1 章
      required:
        - topic
        - philosophers

    DialogueResponse:
      type: object
      properties:
        topic:
          type: string
          description: 对话主题
          example: 什么是理想的社会
        participants:
          type: array
          description: 参与对话的哲学家
          items:
            $ref: '#/components/schemas/PhilosopherInfo'
        dialogue:
          type: array
          description: 对话内容
          items:
            $ref: '#/components/schemas/DialogueTurn'
        summary:
          type: string
          description: 对话总结
          example: "老子强调无为而治，柏拉图主张哲人王统治，两者都追求理想的社会秩序"
      required:
        - topic
        - dialogue

    DialogueTurn:
      type: object
      properties:
        philosopher_id:
          type: string
          description: 发言哲学家 ID
          example: laozi
        philosopher_name:
          type: string
          description: 发言哲学家姓名
          example: 老子
        statement:
          type: string
          description: 发言内容
          example: "治大国，若烹小鲜"
        source:
          type: string
          description: 引用来源
          example: 道德经第 60 章
      required:
        - philosopher_id
        - statement

    ComparativeAnalysisRequest:
      type: object
      properties:
        concept:
          type: string
          description: 要比较的概念
          example: 自然
        traditions:
          type: array
          description: 要比较的哲学传统
          items:
            type: string
          example: [道家，斯多葛学派]
        aspects:
          type: array
          description: 比较的方面
          items:
            type: string
          example: [本体论，伦理学，政治哲学]
      required:
        - concept
        - traditions

    ComparativeAnalysisResponse:
      type: object
      properties:
        concept:
          type: string
          description: 比较的概念
          example: 自然
        traditions:
          type: array
          description: 参与比较的传统
          items:
            $ref: '#/components/schemas/TraditionAnalysis'
        similarities:
          type: array
          description: 相似点列表
          items:
            type: string
        differences:
          type: array
          description: 差异点列表
          items:
            type: string
        conclusion:
          type: string
          description: 比较结论
      required:
        - concept
        - traditions

    TraditionAnalysis:
      type: object
      properties:
        tradition:
          type: string
          description: 哲学传统名称
          example: 道家
        representative:
          type: string
          description: 代表人物
          example: 老子
        viewpoint:
          type: string
          description: 该传统对此概念的观点
          example: "自然即道的运行方式"
        key_texts:
          type: array
          description: 相关经典
          items:
            type: string
          example: [道德经，庄子]
      required:
        - tradition
        - viewpoint

    ConceptCorrespondence:
      type: object
      properties:
        chinese_concept:
          type: string
          description: 中国哲学概念
          example: 道
        western_philosopher:
          $ref: '#/components/schemas/PhilosopherInfo'
        corresponding_concepts:
          type: array
          description: 对应概念列表
          items:
            $ref: '#/components/schemas/ConceptMapping'
        comparison_notes:
          type: string
          description: 比较说明
          example: "海德格尔的'存在'与老子的'道'有相似之处，但也有重要差异"
      required:
        - chinese_concept
        - western_philosopher
        - corresponding_concepts

    ConceptMapping:
      type: object
      properties:
        western_concept:
          type: string
          description: 西方哲学概念
          example: Being (存在)
        similarity:
          type: string
          description: 相似程度
          enum: [high, medium, low]
          example: medium
        explanation:
          type: string
          description: 对应关系说明
          example: "两者都指向终极实在，但道更强调生成性"
      required:
        - western_concept
        - similarity

    # 虚拟注释家相关 Schema
    CommentatorInfo:
      type: object
      properties:
        id:
          type: string
          description: 注释家 ID
          example: wangbi
        name:
          type: string
          description: 注释家姓名
          example: 王弼
        era:
          type: string
          description: 时代
          example: 魏晋
        school:
          type: string
          description: 学派
          example: 玄学
        style:
          type: string
          description: 注释风格
          example: 以无为本，得意忘言
        avatar:
          type: string
          description: 头像 URL
          example: /images/commentators/wangbi.png
      required:
        - id
        - name
        - style

    CommentatorsResponse:
      type: object
      properties:
        commentators:
          type: array
          description: 注释家列表
          items:
            $ref: '#/components/schemas/CommentatorInfo'
      required:
        - commentators

    CommentatorPersona:
      type: object
      properties:
        id:
          type: string
          description: 注释家 ID
          example: wangbi
        name:
          type: string
          description: 姓名
          example: 王弼
        bio:
          type: string
          description: 生平简介
          example: "王弼（226-249），字辅嗣，魏晋时期著名玄学家"
        academic_background:
          type: string
          description: 学术渊源
          example: "承袭老子思想，开创玄学注老传统"
        commentary_style:
          type: string
          description: 注释风格详述
          example: "主张'得意忘言'，以简驭繁"
        key_works:
          type: array
          description: 代表作品
          items:
            type: string
          example: [老子道德经注，周易注]
        expertise:
          type: array
          description: 擅长领域
          items:
            type: string
          example: [本体论，政治哲学]
      required:
        - id
        - name
        - commentary_style

    CommentaryRequest:
      type: object
      properties:
        commentator_id:
          type: string
          description: 注释家 ID
          example: wangbi
        chapter_id:
          type: integer
          description: 章节编号（可选）
          example: 1
        concept:
          type: string
          description: 概念（可选）
          example: 道
        question:
          type: string
          description: 问题
          example: 如何理解'道可道，非常道'？
      required:
        - commentator_id
        - question

    CommentaryResponse:
      type: object
      properties:
        commentator:
          $ref: '#/components/schemas/CommentatorInfo'
        response:
          type: string
          description: 注释家回应
          example: "夫道可道，非常道者，谓可言说之道，非恒常不变之道也"
        analysis:
          type: string
          description: 分析说明
          example: "王弼从本体论角度解释，强调道的超越性"
        related_passages:
          type: array
          description: 相关段落
          items:
            type: object
            properties:
              chapter:
                type: integer
              text:
                type: string
      required:
        - commentator
        - response

  securitySchemes:
    # 目前API没有认证要求，但可以定义速率限制说明
    RateLimit:
      type: apiKey
      in: header
      name: X-RateLimit-Remaining
      description: |
        API 使用速率限制。部分端点有请求频率限制：
        - 搜索端点：30请求/60秒
        - Fish Audio TTS：10请求/60秒
        - Edge TTS：20请求/60秒

        响应头包含速率限制信息：
        - X-RateLimit-Limit: 时间段内允许的最大请求数
        - X-RateLimit-Remaining: 剩余请求数
        - X-RateLimit-Reset: 限制重置时间（Unix时间戳）

