  - name: TTS服务
    description: 文本转语音服务代理接口
  - name: AI创新功能
    description: 基于AI的扩展功能接口
  - name: 知识图谱
    description: 知识图谱相关接口（AI创新功能的子分类）

  - name: 语义考古
    description: 语义考古分析相关接口（AI 创新功能的子分类）
  - name: 跨文明对话
