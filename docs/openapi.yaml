 openapi: 3.0.0
 info:
   title: 古典文献多版本对照学习平台 API
   description: |
     古典文献多版本对照学习平台的 RESTful API。

     支持的经典（9部）：
     - 道德经（道家）：81章，11家注释，6种英译
     - 庄子（道家）：33章，3家注释，2种英译
     - 黄帝内经素问（中医）：81章，3家注释，2种英译
     - 金刚经（佛学）：1章
     - 六祖坛经（佛学）：10章
     - 唯识三十颂（佛学）：30颂
     - 周易（易学）：64卦
     - 四书（儒家）：4部
     - 传习录（心学）：3卷

     平台功能：
     - 多经典管理（经典列表、元数据）
     - 章节内容获取与搜索
     - 疑难字标注与注解
     - TTS（文本转语音）服务代理（Fish Audio、Edge TTS）
     - AI 创新功能（知识图谱、语义考古、跨文明对话、虚拟注释家）

     项目结构：
     - 后端：Flask + Python 3.9+
     - 前端：Vanilla JavaScript + Bootstrap 5
     - 架构：模块化设计（services/, routes/, utils/）
     - 部署：支持 Flask 动态部署和静态站点生成

     重要说明：
     1. API 端点前缀为 `/api`
     2. 支持多经典架构，经典ID通过 URL 路径参数指定（如 ddj, zzj, hdnj）
     3. 向后兼容：保留 `/api/daodejing/*` 路径
     4. 安全性：所有输入都经过验证，搜索端点有速率限制
     5. 速率限制：搜索 30次/分钟，Fish Audio 10次/分钟，Edge TTS 20次/分钟
   version: 2.0.0
  contact:
    name: 道德经平台开发团队
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://daodejing-api.vercel.app/api
    description: 生产环境 API 服务器 (Vercel 部署)
  - url: http://localhost:5000/api
    description: 本地开发服务器

paths:
  # ============ 经典管理 API ============
  /classics:
    get:
      tags:
        - 经典管理
      summary: 获取所有经典列表
      description: 返回系统支持的所有经典古籍列表及其元数据
      operationId: getClassics
      responses:
        '200':
          description: 成功获取经典列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassicsResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{classic_id}/meta:
    get:
      tags:
        - 经典管理
      summary: 获取指定经典的元数据
      description: 根据经典ID获取特定经典的详细元数据信息
      operationId: getClassicMetadata
      parameters:
        - name: classic_id
          in: path
          required: true
          description: 经典ID (如 'ddj' 表示道德经, 'zzj' 表示庄子)
          schema:
            type: string
            example: ddj
      responses:
        '200':
          description: 成功获取经典元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassicMetadata'
        '404':
          description: 未找到指定的经典
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============ 章节内容 API ============
  /{classic_id}/chapters:
    get:
      tags:
        - 章节内容
      summary: 获取经典所有章节列表
      description: 获取指定经典的所有章节列表，包含章节ID和标题
      operationId: getChapters
      parameters:
        - name: classic_id
          in: path
          required: true
          description: 经典ID
          schema:
            type: string
            example: ddj
      responses:
        '200':
          description: 成功获取章节列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChaptersResponse'
        '404':
          description: 未找到指定的经典
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{classic_id}/chapter/{chapter_id}:
    get:
      tags:
        - 章节内容
      summary: 获取单章数据
      description: |
        获取指定经典的单个章节的完整数据，包括：
        - 原文（带疑难字标注）
        - 现代译文
        - 各种注释（王弼注、河上公注等）
        - 古代版本（帛书本、楚简本）
        - 英文翻译
        - 相邻章节信息
      operationId: getChapter
      parameters:
        - name: classic_id
          in: path
          required: true
          description: 经典ID
          schema:
            type: string
            example: ddj
        - name: chapter_id
          in: path
          required: true
          description: 章节编号 (1-81)
          schema:
            type: integer
            minimum: 1
            maximum: 81
            example: 1
      responses:
        '200':
          description: 成功获取章节数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'
        '404':
          description: 未找到指定的章节
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{classic_id}/search:
    get:
      tags:
        - 章节内容
      summary: 搜索章节
      description: |
        在指定经典中搜索包含关键词的章节。
        搜索范围包括原文和现代译文。
        此端点有速率限制：30请求/60秒
      operationId: searchChapters
      parameters:
        - name: classic_id
          in: path
          required: true
          description: 经典ID
          schema:
            type: string
            example: ddj
        - name: q
          in: query
          required: true
          description: 搜索关键词（中英文均可）
          schema:
            type: string
            example: 道可道
      responses:
        '200':
          description: 成功执行搜索
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: 搜索查询无效或包含不安全字符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 请求过于频繁，触发速率限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============ 向后兼容 API ============
  /daodejing/chapters:
    get:
      tags:
        - 向后兼容
      summary: 获取道德经所有章节列表（向后兼容）
      description: 道德经专用端点，与 /ddj/chapters 功能相同
      operationId: getDaodejingChapters
      responses:
        '200':
          description: 成功获取道德经章节列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChaptersResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /daodejing/chapter/{chapter_id}:
    get:
      tags:
        - 向后兼容
      summary: 获取道德经单章数据（向后兼容）
      description: 道德经专用端点，与 /ddj/chapter/{chapter_id} 功能相同
      operationId: getDaodejingChapter
      parameters:
        - name: chapter_id
          in: path
          required: true
          description: 章节编号 (1-81)
          schema:
            type: integer
            minimum: 1
            maximum: 81
            example: 1
      responses:
        '200':
          description: 成功获取道德经章节数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'
        '404':
          description: 未找到指定的章节
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /daodejing/search:
    get:
      tags:
        - 向后兼容
      summary: 搜索道德经章节（向后兼容）
      description: |
        在道德经中搜索包含关键词的章节。
        与 /ddj/search 功能相同，有相同的速率限制：30请求/60秒
      operationId: searchDaodejing
      parameters:
        - name: q
          in: query
          required: true
          description: 搜索关键词（中英文均可）
          schema:
            type: string
            example: 道可道
      responses:
        '200':
          description: 成功执行搜索
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: 搜索查询无效或包含不安全字符
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 请求过于频繁，触发速率限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============ TTS 服务 API ============
  /tts/fish-audio:
    post:
      tags:
        - TTS服务
      summary: Fish Audio TTS 代理
      description: |
        使用 Fish Audio 服务将文本转换为语音。
        此端点有速率限制：10请求/60秒
      operationId: synthesizeFishAudio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSRequest'
      responses:
        '200':
          description: 成功生成语音
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 请求过于频繁，触发速率限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误或 TTS 服务失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tts/edge:
    post:
      tags:
        - TTS服务
      summary: Edge TTS 代理
      description: |
        使用 Microsoft Edge TTS 服务将文本转换为语音。
        此端点有速率限制：20请求/60秒
      operationId: synthesizeEdgeTTS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSRequest'
      responses:
        '200':
          description: 成功生成语音
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 请求过于频繁，触发速率限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误或 TTS 服务失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============ AI 创新功能 API ============
  # 注：以下端点根据项目架构定义，具体实现可能有所不同

  /knowledge/concepts:
    get:
      tags:
        - AI创新功能
        - 知识图谱
      summary: 获取所有概念列表
      description: 获取系统中定义的所有哲学概念列表
      operationId: getConcepts
      responses:
        '200':
          description: 成功获取概念列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptsResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /knowledge/graph/{chapter_id}:
    get:
      tags:
        - AI创新功能
        - 知识图谱
      summary: 获取章节知识图谱
      description: 获取指定章节的知识图谱，展示概念之间的关系
      operationId: getKnowledgeGraph
      parameters:
        - name: chapter_id
          in: path
          required: true
          description: 章节编号 (1-81)
          schema:
            type: integer
            minimum: 1
            maximum: 81
            example: 1
      responses:
        '200':
          description: 成功获取知识图谱
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphResponse'
        '404':
          description: 未找到指定的章节
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============ 语义考古 API ============
  /archaeology/{chapter_id}:
    get:
      tags:
        - AI 创新功能
        - 语义考古
      summary: 获取章节语义考古分析
      description: |
        获取指定章节的语义考古分析，包括：
        - 关键概念的语义演变历史
        - 不同时代的解读差异
        - 概念在不同经典中的使用情况
      operationId: getSemanticArchaeology
      parameters:
        - name: chapter_id
          in: path
          required: true
          description: 章节编号 (1-81)
          schema:
            type: integer
            minimum: 1
            maximum: 81
            example: 1
      responses:
        '200':
          description: 成功获取语义考古分析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SemanticArchaeologyResponse'
        '404':
          description: 未找到指定的章节
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /archaeology/{chapter_id}/concept/{concept}:
    get:
      tags:
        - AI 创新功能
        - 语义考古
      summary: 获取概念解读历史
      description: |
        获取指定概念在特定章节中的解读历史，展示：
        - 历代注释家对该概念的不同理解
        - 概念语义的时代变迁
        - 相关学术争论要点
      operationId: getInterpretationHistory
      parameters:
        - name: chapter_id
          in: path
          required: true
          description: 章节编号 (1-81)
          schema:
            type: integer
            minimum: 1
            maximum: 81
            example: 1
        - name: concept
          in: path
          required: true
          description: 概念名称（如 '道', '德', '无为'）
          schema:
            type: string
            example: 道
      responses:
        '200':
          description: 成功获取概念解读历史
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterpretationHistoryResponse'
        '404':
          description: 未找到指定的章节或概念
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============ 跨文明对话 API ============
  /dialogue/philosophers:
    get:
      tags:
        - AI 创新功能
        - 跨文明对话
      summary: 获取可用哲学家列表
      description: 获取系统中可用于跨文明对话的哲学家/思想家列表
      operationId: getPhilosophers
      responses:
        '200':
          description: 成功获取哲学家列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhilosophersResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dialogue/start:
    post:
      tags:
        - AI 创新功能
        - 跨文明对话
      summary: 发起哲学对话
      description: |
        发起一场跨文明哲学对话，让古代哲学家就特定主题进行"对话"。
        系统会模拟不同哲学传统的思想家对同一问题的不同回应。
      operationId: startDialogue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialogueRequest'
      responses:
        '200':
          description: 成功发起对话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogueResponse'
        '400':
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dialogue/compare:
    post:
      tags:
        - AI 创新功能
        - 跨文明对话
      summary: 获取比较分析
      description: |
        获取不同哲学传统对特定概念或问题的比较分析。
        系统会分析东西方哲学思想的异同点。
      operationId: getComparativeAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparativeAnalysisRequest'
      responses:
        '200':
          description: 成功获取比较分析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparativeAnalysisResponse'
        '400':
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dialogue/correspondence/{concept}/{philosopher_id}:
    get:
      tags:
        - AI 创新功能
        - 跨文明对话
      summary: 获取概念对应关系
      description: |
        获取某个中国哲学概念与特定西方哲学家思想中对应概念的映射关系。
        帮助理解跨文化哲学概念的异同。
      operationId: getConceptCorrespondence
      parameters:
        - name: concept
          in: path
          required: true
          description: 中国哲学概念（如 '道', '仁', '无为'）
          schema:
            type: string
            example: 道
        - name: philosopher_id
          in: path
          required: true
          description: 西方哲学家 ID（如 'plato', 'kant', 'heidegger'）
          schema:
            type: string
            example: heidegger
      responses:
        '200':
          description: 成功获取概念对应关系
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptCorrespondence'
        '404':
          description: 未找到指定的概念或哲学家
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============ 虚拟注释家 API ============
  /commentary/commentators:
    get:
      tags:
        - AI 创新功能
        - 虚拟注释家
      summary: 获取可用注释家列表
      description: 获取系统中可用的虚拟注释家列表，每个注释家都有独特的人设和注释风格
      operationId: getCommentators
      responses:
        '200':
          description: 成功获取注释家列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentatorsResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /commentary/persona/{commentator_id}:
    get:
      tags:
        - AI 创新功能
        - 虚拟注释家
      summary: 获取注释家人设
      description: |
        获取指定虚拟注释家的详细人设信息，包括：
        - 历史背景与学术渊源
        - 注释风格特点
        - 擅长解读的经典类型
        - 代表性观点
      operationId: getCommentatorPersona
      parameters:
        - name: commentator_id
          in: path
          required: true
          description: 注释家 ID（如 'wangbi', 'heshanggong', 'zhuxi'）
          schema:
            type: string
            example: wangbi
      responses:
        '200':
          description: 成功获取注释家人设
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentatorPersona'
        '404':
          description: 未找到指定的注释家
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /commentary/chat:
    post:
      tags:
        - AI 创新功能
        - 虚拟注释家
      summary: 与注释家对话
      description: |
        与虚拟注释家进行对话，获取其对特定章节或概念的解读。
        注释家会以其独特的风格和视角进行回应。
      operationId: chatWithCommentator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentaryRequest'
      responses:
        '200':
          description: 成功获取注释家回应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentaryResponse'
        '400':
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到指定的注释家
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

